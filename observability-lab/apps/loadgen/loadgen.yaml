# Synthetic traffic for PetClinic, itself instrumented with the OpenTelemetry Java agent
# (service.name=petclinic-loadgen). Produces HTTP CLIENT spans that parent PetClinic's SERVER spans.
#
# Change the traffic without editing files:
#   kubectl -n petclinic set env deploy/petclinic-loadgen RPS=10 ERROR_PCT=20
#   kubectl -n petclinic scale deploy/petclinic-loadgen --replicas=0     # stop traffic
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic-loadgen
  labels:
    app.kubernetes.io/name: petclinic-loadgen
    app.kubernetes.io/part-of: observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: petclinic-loadgen
  template:
    metadata:
      labels:
        app.kubernetes.io/name: petclinic-loadgen
        app.kubernetes.io/part-of: observability-lab
    spec:
      initContainers:
        - name: otel-agent
          image: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.31.1
          command: ["cp", "/javaagent.jar", "/otel-agent/opentelemetry-javaagent.jar"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: otel-agent, mountPath: /otel-agent}
      containers:
        - name: loadgen
          image: docker.io/library/eclipse-temurin:21-jdk     # JDK: the source launcher needs javac
          command: ["java", "/src/LoadGen.java"]
          env:
            - {name: TARGET, value: "http://petclinic.petclinic.svc.cluster.local"}
            - {name: RPS, value: "4"}
            - {name: CONCURRENCY, value: "6"}
            - {name: ERROR_PCT, value: "5"}
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel-agent/opentelemetry-javaagent.jar -Xmx128m -XX:+UseSerialGC"
            # the agent skips "JDK tools" by default and `java File.java` (source launcher) counts as one
            - {name: OTEL_JAVAAGENT_ENABLED, value: "true"}
            - {name: OTEL_SERVICE_NAME, value: petclinic-loadgen}
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=petclinic-lab,service.version=1.0,deployment.environment.name=lab,k8s.pod.ip=$(POD_IP),k8s.container.name=loadgen"
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf"}
            - {name: OTEL_METRIC_EXPORT_INTERVAL, value: "15000"}
            - {name: OTEL_LOGS_EXPORTER, value: otlp}
            - {name: OTEL_SEMCONV_STABILITY_OPT_IN, value: database}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - {name: otel-agent, mountPath: /otel-agent, readOnly: true}
            - {name: src, mountPath: /src, readOnly: true}
      volumes:
        - name: otel-agent
          emptyDir: {}
        - name: src
          configMap:
            name: loadgen-src
