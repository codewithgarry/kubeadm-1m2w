# Toxiproxy (Shopify) - TCP proxy used for *controlled* database fault injection.
#
#   petclinic --JDBC--> toxiproxy:5432 --> postgres:5432
#
# With no toxics it is a transparent pass-through. scripts/lab.sh adds/removes toxics
# (latency, jitter, timeouts, bandwidth) through the admin API on :8474, so you can make
# every JDBC span slow and watch it propagate: DB span -> HTTP span -> P95/P99 -> logs.
apiVersion: v1
kind: ConfigMap
metadata:
  name: toxiproxy-config
  namespace: petclinic
data:
  toxiproxy.json: |
    [
      {
        "name": "postgres",
        "listen": "0.0.0.0:5432",
        "upstream": "postgres.petclinic.svc.cluster.local:5432",
        "enabled": true
      }
    ]
---
apiVersion: v1
kind: Service
metadata:
  name: toxiproxy
  namespace: petclinic
  labels:
    app.kubernetes.io/name: toxiproxy
spec:
  selector:
    app.kubernetes.io/name: toxiproxy
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
    - name: admin
      port: 8474
      targetPort: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toxiproxy
  namespace: petclinic
  labels:
    app.kubernetes.io/name: toxiproxy
    app.kubernetes.io/part-of: observability-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: toxiproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: toxiproxy
        app.kubernetes.io/part-of: observability-lab
    spec:
      containers:
        - name: toxiproxy
          image: ghcr.io/shopify/toxiproxy:2.12.0
          args: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
          ports:
            - name: admin
              containerPort: 8474
            - name: postgres
              containerPort: 5432
          readinessProbe:
            httpGet:
              path: /version
              port: admin
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /version
              port: admin
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 96Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          configMap:
            name: toxiproxy-config
