# Grafana Alloy - DaemonSet that tails container stdout/stderr from /var/log/pods on every node
# (including the control plane) and ships it to Loki.
# Chart: grafana/alloy 1.13.0  (Alloy v1.20.0)
#
# Two log paths exist in this lab - on purpose:
#   1. Application logs (petclinic, loadgen): Java agent -> OTLP -> Collector -> Loki
#      These carry trace_id/span_id as structured metadata = the trace<->log correlation path.
#   2. Everything else in Kubernetes (postgres, toxiproxy, kube-system, monitoring, ...): Alloy -> Loki
# The two OTel-instrumented Java containers are dropped here so their lines are not stored twice.
controller:
  type: daemonset
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

alloy:
  mounts:
    varlog: true                 # /var/log/pods/* on the host
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      memory: 256Mi
  enableReporting: false
  configMap:
    create: true
    content: |
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Pods scheduled on *this* node only (each DaemonSet pod handles its own node).
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        // skip containers already sending logs through OpenTelemetry
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_container_name"]
          regex         = "(petclinic|petclinic-loadgen);(petclinic|loadgen)"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          target_label  = "node"
        }
        // service_name = app.kubernetes.io/name, else app label, else container name
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          regex         = "(.+)"
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "service_name"
        }
        rule {
          target_label = "source"
          replacement  = "alloy"
        }
        // file path of the container log on the host
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        // containerd CRI log format: "<time> <stream> <P|F> <line>" (joins partial lines)
        stage.cri {}
        // extract a level for Grafana's log volume colouring when the line has one
        stage.regex {
          expression = "(?i)\\b(?P<level>trace|debug|info|warn|warning|error|fatal|panic)\\b"
        }
        stage.structured_metadata {
          values = { level = "" }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
