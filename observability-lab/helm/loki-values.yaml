# Grafana Loki - monolithic (single binary) mode, filesystem storage on a PVC.
# Chart: grafana-community/loki 18.13.7  (Loki 3.7.8)
#
# Why monolithic: SimpleScalable/Distributed require object storage and 3+ replicas;
# a 2-worker lab with ~4 GiB nodes cannot afford that. One pod, one PVC.
deploymentMode: Monolithic

loki:
  auth_enabled: false            # single tenant ("fake"); no X-Scope-OrgID needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13              # v13 + tsdb is required for structured metadata (trace_id/span_id from OTLP)
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 72h        # match the Prometheus retention (3d)
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_series: 5000
    # OTLP ingestion: which resource attributes become *index labels*.
    # Everything else (incl. trace_id, span_id, exception.*) is stored as structured metadata.
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - deployment.environment.name
              - k8s.namespace.name
              - k8s.pod.name
              - k8s.deployment.name
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true                # powers Grafana "Logs Drilldown" patterns tab
  ingester:
    chunk_encoding: snappy
  querier:
    max_concurrent: 2

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: 650MiB

# --- everything below is switched OFF to keep the footprint small -------------
gateway:
  enabled: false                 # clients talk to loki:3100 directly
chunksCache:
  enabled: false                 # memcached defaults request several GiB
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false

# the scalable/distributed targets must be zero in Monolithic mode
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
